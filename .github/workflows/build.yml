      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: cadence
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: magnum-apk
          path: cadence/app/build/outputs/apk/release/*.apk

      - name: Publish APK as a release (direct download, no zip)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls cadence/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" magnum-android.apk
          gh release create "android-${{ github.run_number }}" magnum-android.apk --repo "${{ github.repository }}" --title "magnum for Android (build ${{ github.run_number }})" --notes "Install magnum-android.apk on your phone or tablet."
